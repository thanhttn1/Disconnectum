modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="thanhtnt2"
description='''
An optimization mod for singleplayer that prevents the "server disconnected" problem in heavy modpacks.

Một mod tối ưu dành cho chơi đơn khi gặp hiện tượng "server disconnected".

Details, commands and compatibility notes: see the README.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="chunky"
type="optional"
versionRange="[1.4.0,)"
ordering="AFTER"
side="BOTH"
